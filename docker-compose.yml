# Optional: Use this to spin up a local PostgreSQL instance for development.
# Run: docker compose up -d
# Then set DATABASE_URL=postgresql://postgres:postgres@localhost:5432/learnhub

version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
